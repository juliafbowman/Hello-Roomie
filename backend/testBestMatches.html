<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Roommate Matches</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }
        .form-section input, .form-section textarea, .form-section select {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 95%;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        #matchesContainer .profile {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Find Your Ideal Roommate</h1>

    <div class="form-section">
        <input type="number" id="age" placeholder="Your Age" required>
        <label>Do you smoke?
            <select id="smoking">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>
        <label>Do you drink socially?
            <select id="drinking_socially">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>
        <label>Open to subleasing?
            <select id="subleasing">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>
        <input type="text" id="country" placeholder="Country" required>
        <input type="text" id="language" placeholder="Primary Language" required>
        <input type="text" id="language_2" placeholder="Secondary Language (optional)">
        <input type="text" id="sex" placeholder="Sex (M/F)" maxlength="1" required>
        <input type="number" id="max_rent" placeholder="Max Rent ($300–$10,000)" min="300" max="10000" required>
        <textarea id="description_tags" placeholder="Description Tags (comma-separated)"></textarea>
        <button onclick="submitPreferences()">🔍 Find Matches</button>
        <p id="submitResult"></p>
    </div>

    <h2>Top Matches</h2>
    <div id="matchesContainer"></div>

    <script>
        function submitPreferences() {
            const preferences = {
                age: parseInt(document.getElementById("age").value),
                smoking: parseInt(document.getElementById("smoking").value),
                drinking_socially: parseInt(document.getElementById("drinking_socially").value),
                subleasing: parseInt(document.getElementById("subleasing").value),
                country: document.getElementById("country").value,
                language: document.getElementById("language").value,
                language_2: document.getElementById("language_2").value || null,
                sex: document.getElementById("sex").value.toUpperCase(),
                max_rent: parseInt(document.getElementById("max_rent").value),
                description_tags: document.getElementById("description_tags").value.split(",").map(tag => tag.trim()).filter(tag => tag)
            };

            fetch("http://127.0.0.1:5000/matchProfiles", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(preferences)
            })
            .then(response => response.json())
            .then(data => {
                if (data.matches) {
                    renderMatches(data.matches);
                } else {
                    document.getElementById("submitResult").textContent = "No matches found.";
                }
            })
            .catch(error => {
                document.getElementById("submitResult").textContent =
                    "Error finding matches: " + error.message;
            });
        }

        function renderMatches(matches) {
            const container = document.getElementById("matchesContainer");
            container.innerHTML = "";
            matches.forEach(match => {
                const div = document.createElement("div");
                div.className = "profile";
                div.innerHTML = `
                    <strong>Name:</strong> ${match.first_name} ${match.last_name}<br>
                    <strong>Age:</strong> ${match.age}<br>
                    <strong>Sex:</strong> ${match.sex}<br>
                    <strong>Country:</strong> ${match.country}<br>
                    <strong>Languages:</strong> ${match.language}${match.language_2 ? ", " + match.language_2 : ""}<br>
                    <strong>Description:</strong> ${match.description || "N/A"}<br>
                    <strong>Max Rent:</strong> $${match.max_rent}<br>
                    <strong>Drinks Socially?:</strong> ${match.drinking_socially ? "Yes" : "No"}<br>
                    <strong>Smokes?:</strong> ${match.smoking ? "Yes" : "No"}<br>
                    <strong>Subleasing?:</strong> ${match.subleasing ? "Yes" : "No"}<br>
                    <strong>Email:</strong> ${match.email}<br>
                    <strong>Phone:</strong> ${match.phone_number || "N/A"}<br>
                    <strong>Social Link:</strong> ${match.social_link ? `<a href="https://${match.social_link}" target="_blank">${match.social_link}</a>` : "N/A"}
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
