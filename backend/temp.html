<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roommate Profiles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .profile, .form-section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }
        .form-section input, .form-section textarea, .form-section select {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 95%;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        #topButtons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Roommate Profiles</h1>

    <div id="topButtons">
        <button onclick="fetchAllProfiles()">🔄 Reload Profiles</button>
        <button onclick="scrollToForm()">➕ Add New Profile</button>
    </div>

    <div id="profilesContainer"></div>

    <h2 id="formSection">Add a New Profile</h2>
    <div class="form-section">
        <input type="text" id="first_name" placeholder="First Name" required>
        <input type="text" id="last_name" placeholder="Last Name" required>
        <input type="number" id="age" placeholder="Age" required>
        <input type="text" id="sex" placeholder="Sex (M/F)" maxlength="1" required>
        <input type="text" id="country" placeholder="Country" required>
        <input type="text" id="language" placeholder="Primary Language" required>
        <input type="text" id="language_2" placeholder="Secondary Language (optional)">
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="social_link" placeholder="Social Link (optional)">
        <input type="text" id="phone_number" placeholder="Phone Number (optional)">
        <textarea id="description" placeholder="Description (optional)"></textarea>

        <label>Smokes?
            <select id="smoking">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>

        <label>Drinks Socially?
            <select id="drinking_socially">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>

        <label>Open to Subleasing?
            <select id="subleasing">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>

        <button onclick="submitProfile()">✅ Submit Profile</button>
        <p id="submitResult"></p>
    </div>

    <script>
        // Load profiles automatically on page load
        window.onload = fetchAllProfiles;

        function fetchAllProfiles() {
            fetch("http://127.0.0.1:5000/profiles")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch profiles");
                    return response.json();
                })
                .then(data => {
                    const sorted = data.sort((a, b) => b.id - a.id); // sort by highest ID
                    renderProfiles(sorted);
                })
                .catch(error => {
                    document.getElementById("profilesContainer").innerHTML =
                        `<p style="color:red;">Error: ${error.message}</p>`;
                });
        }

        function submitProfile() {
            const profile = {
                first_name: document.getElementById("first_name").value,
                last_name: document.getElementById("last_name").value,
                age: parseInt(document.getElementById("age").value),
                sex: document.getElementById("sex").value.toUpperCase(),
                country: document.getElementById("country").value,
                language: document.getElementById("language").value,
                language_2: document.getElementById("language_2").value || null,
                email: document.getElementById("email").value,
                social_link: document.getElementById("social_link").value || null,
                phone_number: document.getElementById("phone_number").value || null,
                description: document.getElementById("description").value || null,
                smoking: parseInt(document.getElementById("smoking").value),
                drinking_socially: parseInt(document.getElementById("drinking_socially").value),
                subleasing: parseInt(document.getElementById("subleasing").value)
            };

            fetch("http://127.0.0.1:5000/insertProfile", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(profile)
            })
            .then(response => response.json())
            .then(data => {
                const msg = data[200] || data[500];
                document.getElementById("submitResult").textContent = msg;

                if (data[200]) {
                    resetFormFields();
                    if (data.profiles) {
                        const sorted = data.profiles.sort((a, b) => b.id - a.id);
                        renderProfiles(sorted);
                    }
                }
            })
            .catch(error => {
                document.getElementById("submitResult").textContent =
                    "Error submitting profile: " + error.message;
            });
        }

        function renderProfiles(profiles) {
            const container = document.getElementById("profilesContainer");
            container.innerHTML = "";
            profiles.forEach(profile => {
                const div = document.createElement("div");
                div.className = "profile";
                div.innerHTML = `
                    <strong>Name:</strong> ${profile.first_name} ${profile.last_name}<br>
                    <strong>Age:</strong> ${profile.age}<br>
                    <strong>Sex:</strong> ${profile.sex}<br>
                    <strong>Country:</strong> ${profile.country}<br>
                    <strong>Languages:</strong> ${profile.language}${profile.language_2 ? ", " + profile.language_2 : ""}<br>
                    <strong>Description:</strong> ${profile.description || "N/A"}<br>
                    <strong>Drinks Socially?:</strong> ${profile.drinking_socially ? "Yes" : "No"}<br>
                    <strong>Smokes?:</strong> ${profile.smoking ? "Yes" : "No"}<br>
                    <strong>Subleasing?:</strong> ${profile.subleasing ? "Yes" : "No"}<br>
                    <strong>Email:</strong> ${profile.email}<br>
                    <strong>Phone:</strong> ${profile.phone_number || "N/A"}<br>
                    <strong>Social Link:</strong> ${profile.social_link ? `<a href="https://${profile.social_link}" target="_blank">${profile.social_link}</a>` : "N/A"}
                `;
                container.appendChild(div);
            });
        }

        function resetFormFields() {
            const fields = [
                "first_name", "last_name", "age", "sex", "country",
                "language", "language_2", "email", "social_link",
                "phone_number", "description"
            ];
            fields.forEach(id => document.getElementById(id).value = "");
            document.getElementById("smoking").value = "0";
            document.getElementById("drinking_socially").value = "0";
            document.getElementById("subleasing").value = "0";
        }

        function scrollToForm() {
            document.getElementById("formSection").scrollIntoView({ behavior: "smooth" });
        }
    </script>
</body>
</html>
